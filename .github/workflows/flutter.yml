name: Bondhu Flutter Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Bondhu Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Bondhu
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk bondhu.apk

      - name: Upload Bondhu APK
        uses: actions/upload-artifact@v4
        with:
          name: Bondhu-APK
          path: bondhu.apk
          if-no-files-found: error
