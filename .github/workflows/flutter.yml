name: Bondhu Flutter Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Bondhu Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Bondhu
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Universal APK
        run: flutter build apk --release --no-shrink

      - name: Check APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          file build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk bondhu.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bondhu-APK
          path: bondhu.apk
          if-no-files-found: error
